name: IWF Daily Results Pipeline

on:
  schedule:
    # Run daily at 10 PM UTC (5 PM EST)
    - cron: '0 22 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to scrape (default: current year)'
        required: false
        type: string
      event_id:
        description: 'Specific IWF Event ID (optional, e.g., 154)'
        required: false
        type: string
      force:
        description: 'Force re-import existing meet results'
        required: false
        type: boolean
        default: false
      athlete_name:
        description: 'Filter to specific athlete name (optional, e.g., Robert HAWKINS)'
        required: false
        type: string

# CRITICAL: Prevent parallel workflow runs
concurrency:
  group: iwf-scraper
  cancel-in-progress: false  # Queue instead of cancel

jobs:
  scrape-iwf:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # Increased from 60 to allow for 5-second inter-event delays

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate no parallel imports
        run: node scripts/maintenance/validate-no-parallel-runs.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Create output directories
        run: |
          mkdir -p output logs errors

      - name: Discover IWF events
        if: ${{ !github.event.inputs.event_id }}
        run: |
          set -o pipefail
          YEAR=${{ github.event.inputs.year || 'current' }}
          if [ "$YEAR" = "current" ]; then
            YEAR=$(date +%Y)
          fi
          echo "Discovering events for year $YEAR..."
          node scripts/production/iwf-event-discovery.js --year $YEAR 2>&1 | tee logs/iwf-event-discovery.log
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      - name: Run IWF scraper
        run: |
          set -o pipefail
          YEAR=${{ github.event.inputs.year || 'current' }}
          if [ "$YEAR" = "current" ]; then
            YEAR=$(date +%Y)
          fi

          EVENT_ID="${{ github.event.inputs.event_id }}"
          if [ -n "$EVENT_ID" ]; then
            CMD_ARGS=("--event-id" "$EVENT_ID" "--year" "$YEAR")
            if [ "${{ github.event.inputs.force }}" = "true" ]; then
              CMD_ARGS+=("--force")
            fi
            if [ -n "${{ github.event.inputs.athlete_name }}" ]; then
              CMD_ARGS+=("--athlete-name" "${{ github.event.inputs.athlete_name }}")
            fi
            echo "Running targeted event importer for Event ID $EVENT_ID..."
            node scripts/production/iwf-database-importer.js "${CMD_ARGS[@]}" 2>&1 | tee logs/iwf-scraper.log
          else
            echo "Running orchestrator for year $YEAR..."
            node scripts/production/iwf-main.js --year $YEAR 2>&1 | tee logs/iwf-scraper.log
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      - name: Link IWF athletes to USAW profiles
        if: success()
        run: |
          set -o pipefail
          echo "Running athlete alias linker (lookback: 3 days)..."
          node scripts/production/link-new-iwf-athletes.js --days 3 2>&1 | tee logs/athlete-linker.log
        env:
          # USAW Database credentials
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iwf-scraper-logs
          path: |
            logs/
            errors/
            output/
          retention-days: 30

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iwf-scraper-summary
          path: output/iwf-scraper-summary-*.json
          retention-days: 90

      - name: Create issue on failure
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const year = context.payload.inputs?.year || 'current';
            const issueBody = [
              'The daily IWF scraper workflow failed.',
              '',
              'Check the logs:',
              `- [Workflow logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '- Artifacts available in workflow details',
              '',
              `Year attempted: ${year}`
            ].join('\n');

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `IWF Scraper failed - ${new Date().toISOString().split('T')[0]}`,
              body: issueBody,
              labels: ['automation', 'iwf-scraper', 'daily-run']
            })

      - name: Report summary to step
        if: always()
        run: |
          echo "## IWF Scraper Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Year**: ${{ github.event.inputs.year || 'current' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow**: [Run #${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          if ls output/iwf-scraper-summary-*.json 1> /dev/null 2>&1; then
            echo "- **Summary artifact**: Available in workflow" >> $GITHUB_STEP_SUMMARY
          fi
